<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>benedictio — the drop is coming</title>
<meta name="theme-color" content="#0d1b2a">
<meta name="description" content="benedictio clothing. Crown of Thorns. Limited edition Christmas drop. Sale ends 31 December.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 fill=%22%2316334f%22/%3E%3Cg fill=%22%23f3f7fa%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%226.6%22 fill=%22none%22 stroke=%22%23f3f7fa%22 stroke-width=%221.8%22/%3E%3Cpath d=%22M18.9 11.1 L23.3 14.8 L18.9 12.9 Z M18.4 14.7 L20.3 20.1 L17.6 16.2 Z M16.2 17.6 L15.2 23.2 L14.7 18.4 Z M12.9 18.9 L9.2 23.3 L11.1 18.9 Z M9.3 18.4 L3.9 20.3 L7.8 17.6 Z M6.4 16.2 L0.8 15.2 L5.6 14.7 Z M5.1 12.9 L0.7 9.2 L5.1 11.1 Z M5.6 9.3 L3.7 3.9 L6.4 7.8 Z M7.8 6.4 L8.8 0.8 L9.3 5.6 Z M11.1 5.1 L14.8 0.7 L12.9 5.1 Z M14.7 5.6 L20.1 3.7 L16.2 6.4 Z M17.6 7.8 L23.2 8.8 L18.4 9.3 Z%22/%3E%3C/g%3E%3C/svg%3E">
<meta name="theme-color" content="#16334f">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f1b2d;--bone:#f3f7fa;--blood:#16334f;--brass:#e3c58a;--hot:#ff5a36;--body:'Inter Tight',system-ui,sans-serif;--black:'UnifrakturCook','Times New Roman',serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);color:var(--bone);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;-webkit-font-smoothing:antialiased;background:radial-gradient(circle at 50% 35%,#24527a 0%,var(--blood) 40%,var(--ink) 100%)}
:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.tag{border:1px solid var(--brass);color:var(--brass);padding:6px 16px;font-weight:700;margin-bottom:24px}
h1{font-family:var(--black);font-size:clamp(56px,14vw,160px);line-height:.9;font-weight:700}
p{max-width:40ch;margin:20px auto 32px;font-size:19px;opacity:.9}
#count{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
#count div{min-width:84px;padding:14px 10px;border:2px solid var(--bone)}
#count b{display:block;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
#count span{font-size:14px;opacity:.8}
#notify{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:32px auto 0;max-width:460px}
#notify input{flex:1 1 220px;padding:14px 18px;border-radius:999px;border:2px solid var(--bone);background:rgba(8,18,32,.4);color:var(--bone);font:inherit;border-radius:0}
#notify input::placeholder{color:#c3d4e4}
#notify button{padding:14px 24px;border-radius:999px;border:2px solid var(--hot);background:var(--hot);color:#fff;font:inherit;font-weight:700;cursor:pointer;border-radius:0}
#notifyMsg{min-height:1.4em;margin-top:10px;font-weight:500}
.follow{margin-top:24px;font-size:15px;opacity:.85}
.follow a{font-weight:700}
body>*:not(script):not(.aur){position:relative;z-index:1}
h1,p,#count{text-shadow:0 2px 26px rgba(15,27,45,.8)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tag{animation:rise 1.4s ease 2.4s both}
h1{animation:rise 1.6s ease 3s both}
body>p:not(.follow){animation:rise 1.4s ease 3.8s both}
#count{animation:rise 1.4s ease 4.4s both}
#notify,#notifyMsg,.follow{animation:rise 1.4s ease 5s both}
@media(prefers-reduced-motion:reduce){.tag,h1,body>p:not(.follow),#count,#notify,#notifyMsg,.follow{animation:none}}
.aur{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
.a1{width:520px;height:520px;background:#3b7fb8;left:-160px;top:-160px;opacity:.45;animation:d1 18s ease-in-out infinite alternate}
.a2{width:460px;height:460px;background:#7fc4e8;right:-130px;top:20%;opacity:.28;animation:d2 22s ease-in-out infinite alternate}
.a3{width:380px;height:380px;background:#ff5c3a;left:30%;bottom:-240px;opacity:.22;animation:d1 26s ease-in-out infinite alternate-reverse}
@keyframes d1{to{transform:translate(90px,60px)}}
@keyframes d2{to{transform:translate(-80px,50px)}}
@media(prefers-reduced-motion:reduce){.aur{animation:none}}
</style>
</head>
<body>
  <div class="aur a1"></div><div class="aur a2"></div><div class="aur a3"></div>
  <div class="tag">Limited edition Christmas drop</div>
  <h1>The drop is coming</h1>
  <p>Crown of Thorns by benedictio, with a Christmas sale that ends 31 December. Once it sells out, it does not come back.</p>
  <div id="count" aria-live="polite">
    <div><b id="d">--</b><span>days</span></div>
    <div><b id="h">--</b><span>hours</span></div>
    <div><b id="m">--</b><span>minutes</span></div>
    <div><b id="s">--</b><span>seconds</span></div>
  </div>
  <form id="notify">
    <input id="email" type="email" required placeholder="Your email" autocomplete="email" aria-label="Email address">
    <button>Notify me</button>
  </form>
  <div id="notifyMsg" aria-live="polite"></div>
  <p class="follow">Follow <a href="https://instagram.com/benedictio.clth" target="_blank" rel="noopener">Instagram</a> or <a href="https://tiktok.com/@benedictio.clth" target="_blank" rel="noopener">TikTok</a>.</p>

<script>
/* ===== DROP SETTINGS ===== */
const DROP_DATE  = "2026-11-26T13:00:00+02:00"; // drop day and time (South Africa time)
const NOTIFY_URL = "https://formspree.io/f/maeezdor";
/* ========================= */

const $ = id => document.getElementById(id);
let opening = false;

async function goToShop(){
  if (opening) return; opening = true;
  try{
    const r = await fetch("shop.html",{method:"HEAD",cache:"no-store"});
    if (r.ok){ location.replace("shop.html"); return; }
  }catch(_){}
  $("notifyMsg").textContent = "The shop is opening now. One moment...";
  opening = false;
}
function tick(){
  const left = new Date(DROP_DATE) - Date.now();
  if (left <= 0){ ["d","h","m","s"].forEach(i=>$(i).textContent="00"); goToShop(); return; }
  const p = n => String(n).padStart(2,"0");
  $("d").textContent = p(Math.floor(left/864e5));
  $("h").textContent = p(Math.floor(left/36e5)%24);
  $("m").textContent = p(Math.floor(left/6e4)%60);
  $("s").textContent = p(Math.floor(left/1e3)%60);
}
tick(); setInterval(tick,1000);

$("notify").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = $("notifyMsg"), form = e.target;
  if (!NOTIFY_URL){ msg.textContent = "Email sign-up is not connected yet."; return; }
  msg.textContent = "Saving...";
  try{
    const r = await fetch(NOTIFY_URL,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({email:$("email").value,source:"drop page"})});
    if(!r.ok) throw new Error();
    msg.textContent = "You are on the list. We will email you on drop day.";
    form.reset();
  }catch(_){ msg.textContent = "Could not save your email. Please try again."; }
});
</script>
</body>
</html>
