<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Track your order — benedictio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c1416;--stone:#dcd6cc;--bone:#f4f0e9;--blood:#5b0f1b;--brass:#b08d57;--hot:#ff4a1c;
--body:'Inter Tight',system-ui,sans-serif;--black:'UnifrakturCook','Times New Roman',serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bone);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.wrap{max-width:720px;margin:0 auto;padding:0 24px}
header{background:var(--bone);border-bottom:1px solid var(--ink)}
header .wrap{max-width:1180px;display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-family:var(--black);font-size:30px;text-decoration:none}
header a.back{font-weight:500;text-decoration:none;border-bottom:2px solid transparent}
header a.back:hover{border-color:var(--blood)}
.hero{background:var(--blood);color:var(--bone);padding:56px 0 48px}
h1{font-family:var(--black);font-size:clamp(48px,10vw,96px);line-height:.95;font-weight:700}
.hero p{margin-top:16px;max-width:46ch;opacity:.9;font-size:18px}
main{padding:40px 0 80px}
form{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 240px;padding:15px;border:2px solid var(--ink);background:#fff;color:var(--ink);font:inherit;border-radius:0}
button{padding:15px 28px;border:2px solid var(--hot);background:var(--hot);color:#fff;font:inherit;font-weight:700;cursor:pointer;border-radius:0}
button:hover{background:var(--ink);border-color:var(--ink)}
.hint{margin-top:10px;font-size:14px;color:#5a4d50}
#result{margin-top:36px}
.card{border:2px solid var(--ink);padding:24px;background:#fff}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.num{font-weight:700;font-size:20px}
.badge{background:var(--ink);color:var(--bone);padding:4px 12px;font-size:13px;font-weight:700}
.now{font-family:var(--black);font-size:36px;line-height:1.1;margin:10px 0 4px;color:var(--blood)}
.note{margin:8px 0 0;color:#3d3235}
.upd{font-size:13px;color:#7a6d70;margin-top:8px}
ol{list-style:none;margin-top:28px;border-top:1px solid var(--ink)}
li{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--stone);color:#8b7f82}
li .dot{flex:none;width:22px;height:22px;border:2px solid #b9aeb1;border-radius:50%;margin-top:2px}
li.done{color:var(--ink)}
li.done .dot{background:var(--ink);border-color:var(--ink)}
li.cur{color:var(--ink);font-weight:700}
li.cur .dot{background:var(--hot);border-color:var(--hot);box-shadow:0 0 0 4px rgba(255,74,28,.25)}
li small{display:block;font-weight:400;color:#6b5f62}
.err{border:2px solid var(--hot);padding:16px;background:#fff}
footer{background:var(--ink);color:#9d9296;padding:24px 0 32px;font-size:14px}
footer .wrap{max-width:1180px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="index.html">benedictio</a>
    <a class="back" href="index.html">Back to shop</a>
  </div>
</header>

<div class="hero">
  <div class="wrap">
    <h1>Track your order</h1>
    <p>Enter the order number from your Payhip confirmation email to see where your parcel is.</p>
  </div>
</div>

<main>
  <div class="wrap">
    <form id="f">
      <input id="q" required placeholder="Order number" autocomplete="off" aria-label="Order number">
      <button>Track</button>
    </form>
    <p class="hint" id="hint">Your order number is in the confirmation email Payhip sent you after you paid.</p>
    <div id="result" aria-live="polite"></div>
  </div>
</main>

<footer><div class="wrap">Questions? Message us on <a href="https://instagram.com/benedictio.clth" target="_blank" rel="noopener">Instagram</a> or <a href="https://tiktok.com/@benedictio.clth" target="_blank" rel="noopener">TikTok</a>.</div></footer>

<script>
/* ===== SETTINGS ===== */
// Paste your Google Sheet "Publish to web" CSV link between the quotes.
// While it is empty the page runs in demo mode with two fake orders.
const SHEET_CSV_URL = "";
/* ==================== */

const STEPS = {
  ZA: [
    ["Order received","We have your order and payment."],
    ["Packaging","Your items are being packed."],
    ["Handed to courier","The courier has collected your parcel."],
    ["In transit","Your parcel is on its way to you."],
    ["Out for delivery","The courier is delivering today."],
    ["Delivered","Your parcel has arrived."]
  ],
  INTL: [
    ["Order received","We have your order and payment."],
    ["Packaging","Your items are being packed."],
    ["Handed to courier","The courier has collected your parcel."],
    ["Left South Africa","Your parcel is on its international journey."],
    ["Customs clearance","Your parcel is being cleared by customs in your country."],
    ["Out for delivery","The local courier is delivering today."],
    ["Delivered","Your parcel has arrived."]
  ]
};

const DEMO = [
  {order:"BEN-1001",region:"ZA",status:"4",note:"Courier tracking number: ZA123456789",updated:"2026-12-07"},
  {order:"BEN-2002",region:"INTL",status:"5",note:"Held at customs. This is normal and usually takes 1 to 3 days.",updated:"2026-12-08"}
];

const $ = id => document.getElementById(id);
const clean = v => String(v||"").trim().replace(/^#/,"").toLowerCase();

function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if (c==='"') q=true;
    else if (c===",") { row.push(cell); cell=""; }
    else if (c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n") i++; row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=c;
  }
  if (cell||row.length){ row.push(cell); rows.push(row); }
  const head = rows.shift().map(h=>h.trim().toLowerCase());
  return rows.filter(r=>r.some(x=>x.trim())).map(r=>{ const o={}; head.forEach((h,i)=>o[h]=(r[i]||"").trim()); return o; });
}

async function load(){
  if (!SHEET_CSV_URL) return DEMO;
  const r = await fetch(SHEET_CSV_URL,{cache:"no-store"});
  if (!r.ok) throw new Error();
  return parseCSV(await r.text());
}

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function show(o){
  const steps = STEPS[(o.region||"ZA").toUpperCase()==="INTL"?"INTL":"ZA"];
  const n = Math.min(Math.max(parseInt(o.status,10)||1,1),steps.length);
  const list = steps.map((s,i)=>{
    const cls = i+1<n?"done":(i+1===n?"cur":"");
    return '<li class="'+cls+'"><span class="dot"></span><span>'+esc(s[0])+'<small>'+esc(s[1])+'</small></span></li>';
  }).join("");
  $("result").innerHTML =
    '<div class="card"><div class="top"><span class="num">Order '+esc(o.order)+'</span><span class="badge">'+((o.region||"").toUpperCase()==="INTL"?"International":"South Africa")+'</span></div>' +
    '<div class="now">'+esc(steps[n-1][0])+'</div>' +
    (o.note?'<p class="note">'+esc(o.note)+'</p>':'') +
    (o.updated?'<p class="upd">Last updated '+esc(o.updated)+'</p>':'') +
    '<ol>'+list+'</ol></div>';
}

$("f").addEventListener("submit", async e=>{
  e.preventDefault();
  const res = $("result");
  res.innerHTML = '<p>Looking up your order...</p>';
  try{
    const rows = await load();
    const hit = rows.find(r=>clean(r.order)===clean($("q").value));
    if (hit) show(hit);
    else res.innerHTML = '<div class="err"><b>We could not find that order number.</b><br>Check it matches your confirmation email. Orders can take up to a day to appear after you pay.</div>';
  }catch(_){
    res.innerHTML = '<div class="err">Tracking is unavailable right now. Please try again in a minute.</div>';
  }
});

if (!SHEET_CSV_URL) $("hint").textContent = "Demo mode: try BEN-1001 (South Africa) or BEN-2002 (international).";
</script>
</body>
</html>
